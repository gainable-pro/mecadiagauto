<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <defs>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff1e00" />
    </linearGradient>
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e8f0" />
      <stop offset="100%" stop-color="#8a9ba8" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="boostGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>
  </defs>

  <!-- TURBO EMBLEM ICON (Left) -->
  <g transform="translate(60, 60)">
    <!-- Outer Boost Gauge Track -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#161e2e" stroke-width="6" />
    <!-- Glowing Segment (Tachometer / Turbo boost arc) -->
    <path d="M -34,34 A 48 48 0 1 1 34,34" fill="none" stroke="url(#electricCyan)" stroke-width="6" stroke-linecap="round" filter="url(#glowFilter)" />
    <!-- Overboost Warning Arc -->
    <path d="M 24,-41 A 48 48 0 0 1 45,-16" fill="none" stroke="url(#neonOrange)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Central Turbo Housing Ring -->
    <circle cx="0" cy="0" r="34" fill="#0d1117" stroke="#253248" stroke-width="2.5" />
    <circle cx="0" cy="0" r="30" fill="#070a0f" />

    <!-- Turbo Compressor Blades (Curved & dynamic) -->
    <g id="blades" fill="url(#chromeText)">
      <!-- Blade 1 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" />
      <!-- Blade 2 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(45)" />
      <!-- Blade 3 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(90)" />
      <!-- Blade 4 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(135)" />
      <!-- Blade 5 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(180)" />
      <!-- Blade 6 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(225)" />
      <!-- Blade 7 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(270)" />
      <!-- Blade 8 -->
      <path d="M 0,-6 C 8,-12 18,-24 16,-28 C 14,-29 6,-25 -2,-18 C -5,-13 -4,-8 0,-6 Z" transform="rotate(315)" />
    </g>

    <!-- Center Spinner Nut -->
    <polygon points="0,-7 6,-3 6,4 0,7 -6,4 -6,-3" fill="url(#neonOrange)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    
    <!-- Pulse Ring Glow -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff3b00" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- LOGO TEXT BRAND -->
  <g transform="translate(130, 0)">
    <!-- "MECA" Text -->
    <text x="0" y="58" font-family="'Montserrat', 'Rajdhani', 'Impact', sans-serif" font-weight="900" font-size="44" fill="url(#chromeText)" letter-spacing="2">
      MECA<tspan fill="#00f0ff">.</tspan>DIAG
    </text>

    <!-- "AUTO" Racing Performance Badge -->
    <g transform="translate(258, 20)">
      <polygon points="0,0 120,0 106,42 -14,42" fill="url(#neonOrange)" filter="url(#glowFilter)" opacity="0.95" />
      <text x="50" y="30" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">
        AUTO
      </text>
    </g>

    <!-- Performance Subtitle -->
    <text x="3" y="85" font-family="'Rajdhani', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#8da2b8" letter-spacing="4">
      REPROGRAMMATION MOTEUR <tspan fill="#ff4d00">•</tspan> BIO-ETHANOL E85 <tspan fill="#00f0ff">•</tspan> ELECTRONIQUE
    </text>

    <!-- Local Region Miramas Badge -->
    <g transform="translate(3, 93)">
      <rect x="0" y="0" width="190" height="18" rx="4" fill="#111827" stroke="#2a3850" stroke-width="1" />
      <circle cx="10" cy="9" r="4" fill="#00f0ff" />
      <text x="20" y="13" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#cbd5e1" letter-spacing="1">
        MIRAMAS &amp; RAYON 100 KM
      </text>
    </g>
  </g>
</svg>