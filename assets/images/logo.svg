<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Plate Gradient -->
    <linearGradient id="carbonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#040507" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Chrome Metallic Gradient -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="52%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Racing Red Gradient -->
    <linearGradient id="racingRedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e40" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Electric Cyan / Spark Gradient -->
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Turbo Metal Bevel -->
    <radialGradient id="turboBevel" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neonRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonSparkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* TURBO ROTATION ANIMATION */
    @keyframes turbineSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .turbo-blades-group {
      transform-origin: 90px 92px;
      animation: turbineSpin 3.5s linear infinite;
    }

    /* ELECTRIC PULSE ANIMATIONS */
    @keyframes electricArc {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8) drop-shadow(0 0 14px #0284c7); }
    }
    .electric-pulse {
      animation: electricArc 1.6s ease-in-out infinite;
    }

    @keyframes redNeonPulse {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 3px #ff1e40); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #ff1e40); }
    }
    .red-pulse {
      animation: redNeonPulse 2s ease-in-out infinite;
    }

    @keyframes headlightBeam {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #ffffff); }
    }
    .headlight-flash {
      animation: headlightBeam 2.2s ease-in-out infinite;
    }
  </style>

  <!-- Deep Black Titanium Plaque -->
  <rect x="2" y="2" width="876" height="176" rx="14" fill="url(#carbonPlate)" stroke="#1e2430" stroke-width="1.8" />

  <!-- Speed Mesh Carbon Lines in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="2">
    <line x1="720" y1="10" x2="670" y2="170" />
    <line x1="745" y1="10" x2="695" y2="170" />
    <line x1="770" y1="10" x2="720" y2="170" />
    <line x1="795" y1="10" x2="745" y2="170" />
    <line x1="820" y1="10" x2="770" y2="170" />
    <line x1="845" y1="10" x2="795" y2="170" />
  </g>

  <!-- ====================================================================
       1. 3D CHROME TURBOCHARGER (Left)
       ==================================================================== -->
  <g id="turbocharger-assembly">
    <!-- Turbo External Snail Compressor Housing -->
    <path d="M 90,24 C 135,24 165,55 165,95 C 165,135 130,162 88,162 C 45,162 20,132 20,95 C 20,62 42,32 75,25 L 85,12 L 125,12 L 122,25 Z" 
          fill="url(#turboBevel)" stroke="#475569" stroke-width="2" />
    <!-- Compressor Outlet Pipe Extension -->
    <path d="M 85,12 L 135,12 L 130,42 L 80,42 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <line x1="135" y1="10" x2="135" y2="44" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

    <!-- Red Glowing Velocity Stack Ring -->
    <circle cx="90" cy="92" r="54" fill="#07090e" stroke="#ff1e40" stroke-width="3" class="red-pulse" filter="url(#neonRedGlow)" />
    <circle cx="90" cy="92" r="50" fill="#050608" stroke="#1e293b" stroke-width="2" />
    <circle cx="90" cy="92" r="44" fill="#020305" />

    <!-- ROTATING TURBINE WHEEL BLADES (ANIMATED) -->
    <g class="turbo-blades-group">
      <!-- 12 Aerodynamic Curved Compressor Impeller Blades -->
      <!-- Center is at (90, 92) -->
      <g transform="translate(90, 92)">
        <g fill="url(#chromeMetal)" stroke="#0f172a" stroke-width="0.75">
          <!-- Blade 1 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" />
          <!-- Blade 2 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(30)" />
          <!-- Blade 3 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(60)" />
          <!-- Blade 4 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(90)" />
          <!-- Blade 5 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(120)" />
          <!-- Blade 6 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(150)" />
          <!-- Blade 7 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(180)" />
          <!-- Blade 8 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(210)" />
          <!-- Blade 9 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(240)" />
          <!-- Blade 10 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(270)" />
          <!-- Blade 11 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(300)" />
          <!-- Blade 12 -->
          <path d="M 0,-7 C 10,-14 26,-32 22,-39 C 19,-41 8,-33 -3,-24 C -7,-18 -5,-10 0,-7 Z" transform="rotate(330)" />
        </g>
      </g>
    </g>

    <!-- Compressor Center Hub Nut (Stationary Point) -->
    <circle cx="90" cy="92" r="11" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.5" />
    <circle cx="90" cy="92" r="5" fill="#ff1e40" />
    <circle cx="90" cy="92" r="2" fill="#ffffff" />
  </g>

  <!-- ====================================================================
       2. SUPERCAR SILHOUETTE (Top Center)
       ==================================================================== -->
  <g id="supercar-silhouette" transform="translate(320, 10)">
    <!-- Aerodynamic Roofline Curve in Pure White & Chrome -->
    <path d="M 0,26 C 30,12 85,3 150,3 C 215,3 270,12 320,24 C 345,30 365,36 385,42" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 4px rgba(255,255,255,0.7))" />
    <!-- Rear Deck & Spoiler Red Racing Accent -->
    <path d="M -15,32 C 0,30 18,28 35,27" fill="none" stroke="#ff1e40" stroke-width="3" stroke-linecap="round" class="red-pulse" />
    <!-- Side Window Outline -->
    <path d="M 75,20 C 120,9 180,9 230,18 C 240,20 255,23 265,26 L 85,26 Z" fill="rgba(255,255,255,0.12)" stroke="none" />
    <!-- Glowing Laser Headlights (Right front) -->
    <polygon points="345,28 368,34 350,36" fill="#ffffff" class="headlight-flash" />
    <line x1="365" y1="34" x2="410" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#neonSparkGlow)" />
  </g>

  <!-- ====================================================================
       3. CENTRAL TYPOGRAPHY (MECA DIAG AUTO)
       ==================================================================== -->
  <!-- Dynamic Slanted Slash Separator -->
  <polygon points="182,38 188,38 174,116 168,116" fill="url(#racingRedGlow)" opacity="0.95" filter="url(#neonRedGlow)" />

  <!-- "MECA DIAG" In Pure Chrome 3D Metallic Italics -->
  <text x="200" y="80" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="48" 
        fill="url(#chromeMetal)" 
        letter-spacing="2.5"
        stroke="#000000"
        stroke-width="1.2">
    MECA DIAG
  </text>

  <!-- "AUTO" In Bold Racing Pill Badge with Red Glow -->
  <g transform="translate(545, 38)">
    <!-- Pill Capsule with Bevel -->
    <path d="M 12,0 L 140,0 C 152,0 160,9 156,22 L 148,42 C 145,49 138,52 130,52 L 2,52 C -8,52 -14,43 -10,30 L -2,10 C 2,3 7,0 12,0 Z" 
          fill="#ffffff" stroke="url(#racingRedGlow)" stroke-width="2.5" filter="url(#neonRedGlow)" />
    <!-- Inner Chrome Bevel -->
    <text x="72" y="38" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="34" 
          fill="#000000" 
          text-anchor="middle" 
          letter-spacing="3">
      AUTO
    </text>
  </g>

  <!-- Sub-banner: REPROGRAMMATION MOTEUR • RÉPARATION ÉLECTRONIQUE -->
  <g transform="translate(200, 108)">
    <text x="0" y="0" font-family="'Rajdhani', 'Montserrat', sans-serif" font-weight="800" font-size="14.5" fill="#f8fafc" letter-spacing="3.8">
      REPROGRAMMATION MOTEUR <tspan fill="#ff1e40" font-weight="900">•</tspan> RÉPARATION ÉLECTRONIQUE
    </text>
  </g>

  <!-- Horizontal Dividing Red Neon Filament -->
  <line x1="200" y1="120" x2="850" y2="120" stroke="url(#racingRedGlow)" stroke-width="1.5" opacity="0.65" />

  <!-- ====================================================================
       4. THE 3 ELECTRIFIED TECHNICAL BADGES (BOTTOM)
       ==================================================================== -->
  <!-- BADGE 1: REPROG MOTEUR (ECU/TCU) avec Puce Électronique Clignotante -->
  <g id="badge-chip" transform="translate(200, 130)">
    <!-- Microchip Outline -->
    <rect x="0" y="2" width="22" height="22" rx="3" fill="#0d131f" stroke="#38bdf8" stroke-width="1.6" class="electric-pulse" />
    <rect x="5" y="7" width="12" height="12" rx="1.5" fill="#0369a1" />
    <!-- Microchip Pins -->
    <line x1="-3" y1="7" x2="0" y2="7" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-3" y1="13" x2="0" y2="13" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-3" y1="19" x2="0" y2="19" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="22" y1="7" x2="25" y2="7" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="22" y1="13" x2="25" y2="13" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="22" y1="19" x2="25" y2="19" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Circuit Core Dot -->
    <circle cx="11" cy="13" r="2.5" fill="#ffffff" class="electric-pulse" />

    <text x="32" y="14" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" letter-spacing="1.2">
      REPROG MOTEUR <tspan fill="#94a3b8" font-size="9.5">(ECU/TCU)</tspan>
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="395" y1="130" x2="395" y2="158" stroke="#334155" stroke-width="1" />

  <!-- BADGE 2: ÉLECTRICITÉ AUTOMOBILE avec Batterie & Éclair Électrique Clignotant -->
  <g id="badge-battery" transform="translate(415, 130)">
    <!-- Car Battery Body -->
    <rect x="0" y="4" width="26" height="18" rx="2.5" fill="#0f172a" stroke="#ff1e40" stroke-width="1.6" class="red-pulse" />
    <!-- Battery Terminals (+ and -) -->
    <rect x="3" y="1" width="5" height="3" fill="#cbd5e1" />
    <rect x="18" y="1" width="5" height="3" fill="#ff1e40" />
    <!-- Electric Lightning Bolt in Center (Pulsing Glow) -->
    <polygon points="15,6 9,13 14,13 11,20 18,12 13,12" fill="#ffffff" class="electric-pulse" filter="url(#neonSparkGlow)" />

    <text x="34" y="14" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" letter-spacing="1.2">
      ÉLECTRICITÉ <tspan fill="#cbd5e1">AUTO</tspan>
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="585" y1="130" x2="585" y2="158" stroke="#334155" stroke-width="1" />

  <!-- BADGE 3: DIAGNOSTIC MULTIMARQUES avec Ordinateur / Onde ECG Pulsante -->
  <g id="badge-diag" transform="translate(605, 130)">
    <!-- Rugged Laptop Screen -->
    <rect x="0" y="2" width="26" height="17" rx="2" fill="#080c14" stroke="#38bdf8" stroke-width="1.6" class="electric-pulse" />
    <!-- Laptop Keyboard Base -->
    <polygon points="-4,22 30,22 27,19 -1,19" fill="#334155" />
    <!-- Oscilloscope ECG Telemetry Wave on Screen -->
    <path d="M 3,11 L 8,11 L 11,5 L 14,16 L 17,9 L 20,11 L 23,11" 
          fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="electric-pulse" />

    <text x="36" y="14" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" letter-spacing="1.2">
      DIAGNOSTIC <tspan fill="#94a3b8">MULTIMARQUES</tspan>
    </text>
  </g>
</svg>
