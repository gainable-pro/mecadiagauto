<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="100%" height="100%">
  <defs>
    <!-- Dark Titanium Carbon Base -->
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#030304" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Chrome / Pure White Metallics -->
    <linearGradient id="pureWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="silverSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Red Racing Needle Accent -->
    <linearGradient id="racingRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a00" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
  </defs>

  <!-- Deep Black Racing Background Plaque -->
  <rect x="0" y="0" width="680" height="130" rx="14" fill="url(#bgPlate)" stroke="#1f242d" stroke-width="1.5" />

  <!-- Speed Racing Carbon Stripe Texture (Right side) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="560" y1="10" x2="520" y2="120" />
    <line x1="580" y1="10" x2="540" y2="120" />
    <line x1="600" y1="10" x2="560" y2="120" />
    <line x1="620" y1="10" x2="580" y2="120" />
    <line x1="640" y1="10" x2="600" y2="120" />
    <line x1="660" y1="10" x2="620" y2="120" />
  </g>

  <!-- MOTORSPORT TURBO EMBLEM (Left) -->
  <g transform="translate(68, 65)">
    <!-- Outer Precision Tachometer Ring -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#222834" stroke-width="3" />
    <path d="M -31,31 A 44 44 0 1 1 31,31" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 22,-38 A 44 44 0 0 1 42,-14" fill="none" stroke="url(#racingRed)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Central Hub -->
    <circle cx="0" cy="0" r="30" fill="#0d1117" stroke="#333d4d" stroke-width="2" />
    <circle cx="0" cy="0" r="26" fill="#040608" />

    <!-- Sculpted Turbo Blades in Pure White & Silver -->
    <g fill="url(#pureWhite)">
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(45)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(90)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(135)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(180)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(225)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(270)" />
      <path d="M 0,-5 C 7,-10 16,-21 14,-25 C 12,-26 5,-22 -2,-16 C -5,-12 -4,-7 0,-5 Z" transform="rotate(315)" />
    </g>

    <!-- Spinner Cap with Red Performance Ring -->
    <circle cx="0" cy="0" r="8" fill="#1e2430" stroke="#ff2a00" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY SPORT EN BLANC -->
  <g transform="translate(138, 0)">
    <!-- Dynamic Slanted Slash -->
    <polygon points="12,28 18,28 2,102 -4,102" fill="url(#racingRed)" opacity="0.9" />

    <!-- "MECA DIAG" In Pure White Racing Italics -->
    <text x="24" y="66" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="url(#pureWhite)" letter-spacing="2">
      MECA DIAG
    </text>

    <!-- "AUTO" Badge In White with Red Sport Line -->
    <g transform="translate(325, 27)">
      <polygon points="0,0 115,0 98,44 -17,44" fill="#ffffff" />
      <text x="46" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#000000" text-anchor="middle" letter-spacing="3">
        AUTO
      </text>
    </g>

    <!-- Sport Subtitles in Pure White & Silver -->
    <text x="25" y="94" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13.5" fill="#f1f5f9" letter-spacing="4">
      REPROGRAMMATION MOTEUR <tspan fill="#ff2a00">•</tspan> BANC 4X4 <tspan fill="#ff2a00">•</tspan> BIO-ETHANOL E85
    </text>

    <text x="25" y="112" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="3">
      ATELIER MIRAMAS (13) — RAYONNEMENT 100 KM PACA
    </text>
  </g>
</svg>
